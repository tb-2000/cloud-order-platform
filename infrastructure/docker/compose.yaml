
services:
  postgres:
    image: postgres:17
    container_name: cloudorder-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: cloudorder
      POSTGRES_PASSWORD: devpassword

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudorder -d productdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
